# Opens pull requests when GitHub Actions or Gradle dependencies have updates, including
# security fixes. Submodules (JS8Core, llama.cpp) and Hamlib are updated by hand, because
# their updates need on-air testing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ '*' ]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions of the build toolchain (Android Gradle Plugin 9, Gradle 9, Kotlin) need code
    # and build-script changes, so they are done by hand. Library updates come in two groups so a
    # failing one doesn't hold back the rest; security fixes still come through.
    ignore:
      - dependency-name: "com.android.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "gradle-wrapper"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "com.google.devtools.ksp"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    groups:
      androidx:
        patterns: [ 'androidx.*', 'com.google.android.material*' ]
      other:
        patterns: [ '*' ]
