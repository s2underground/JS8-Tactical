# Opens pull requests when GitHub Actions or Gradle dependencies have updates, including
# security fixes. Submodules (JS8Core, llama.cpp) and Hamlib are updated by hand, because
# their updates need on-air testing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ '*' ]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: [ '*' ]
