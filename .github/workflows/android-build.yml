name: Android Build

on:
  push:
    branches: [ master, develop ]
    # A version tag (v1.2.0-alpha.1) builds a signed release APK and publishes it as a GitHub release.
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - 'core/**'
      - 'adapters/android/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'android/**'
      - 'core/**'
      - 'adapters/android/**'
      - 'scripts/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

env:
  HAMLIB_VERSION: 1b2461aba99f0dde0531e1732c00e60aeee40657
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  core-tests:
    name: Core native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev

      - name: Run js8core tests
        run: ./scripts/test-core.sh

  build:
    name: Build Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'both' && '["debug","release"]' || format('["{0}"]', github.event.inputs.build_type)) || (startsWith(github.ref, 'refs/tags/v') && '["release"]' || '["debug"]')) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK packages
      run: |
        SDKMANAGER=""
        for candidate in "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager; do
          if [ -x "${candidate}" ]; then
            SDKMANAGER="${candidate}"
            break
          fi
        done
        test -n "${SDKMANAGER}"
        echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
        yes | "${SDKMANAGER}" --licenses > /dev/null
        "${SDKMANAGER}" --install \
          "platform-tools" \
          "platforms;android-34" "platforms;android-36" \
          "build-tools;34.0.0" "build-tools;35.0.0" \
          "ndk;${ANDROID_NDK_VERSION}" \
          "cmake;3.22.1"

    - name: Select NDK
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Install Hamlib build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config

    - name: Cache Hamlib build
      id: cache-hamlib
      uses: actions/cache@v4
      with:
        path: |
          android/hamlib/hamlib-src
          android/libs/hamlib
        key: ${{ runner.os }}-hamlib-${{ env.HAMLIB_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('android/hamlib/patches/*.patch', 'android/hamlib/build-hamlib-android.sh') }}

    - name: Build Hamlib
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        export HAMLIB_VERSION=${HAMLIB_VERSION}
        ./android/hamlib/build-hamlib-android.sh

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # Release builds must have the key. Test builds use it too when it's available (so they install
    # over releases); without it (e.g. a pull request from a fork) they fall back to the debug key.
    - name: Prepare release keystore
      run: |
        if [ -z "${{ secrets.JS8_KEYSTORE_BASE64 }}" ]; then
          if [ "${{ matrix.build-type }}" = "release" ]; then
            echo "Missing JS8_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "No release key available: this test build is signed with the debug key."
          exit 0
        fi
        echo "${{ secrets.JS8_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks

    - name: Configure release signing env
      run: |
        [ -f android/release.jks ] || exit 0
        echo "JS8_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
        echo "JS8_KEYSTORE_PASSWORD=${{ secrets.JS8_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
        echo "JS8_KEY_ALIAS=${{ secrets.JS8_KEY_ALIAS }}" >> "$GITHUB_ENV"
        echo "JS8_KEY_PASSWORD=${{ secrets.JS8_KEY_PASSWORD }}" >> "$GITHUB_ENV"

    - name: Build with Gradle
      working-directory: android
      run: |
        if [ "${{ matrix.build-type }}" == "release" ]; then
          ./gradlew assembleRelease bundleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Run tests
      working-directory: android
      run: ./gradlew test

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: js8-baseline-${{ matrix.build-type }}-apk
        path: android/app/build/outputs/apk/${{ matrix.build-type }}/*.apk

    - name: Publish rolling test build
      if: matrix.build-type == 'debug' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
        cp "$APK" JS8-Tactical-test.apk
        gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Latest test build" --notes "Rolling test build from master."
        gh release upload test-build JS8-Tactical-test.apk --clobber
        gh release edit test-build --notes "Rolling test build from master. Commit ${GITHUB_SHA::8}, run #${GITHUB_RUN_NUMBER}, built $(date -u +%Y-%m-%dT%H:%MZ)."

    - name: Publish signed alpha/release build
      if: matrix.build-type == 'release' && startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
        test -n "$APK" || { echo "No signed release APK (is release signing configured?)"; exit 1; }
        cp "$APK" "JS8-Tactical-${TAG}.apk"
        PRE=""; case "$TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease";; esac
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --title "JS8-Tactical ${TAG}" --notes "Signed build of ${TAG} (commit ${GITHUB_SHA::8})."
        gh release upload "$TAG" "JS8-Tactical-${TAG}.apk" --clobber

    - name: Upload AAR
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: js8call-core-aar
        path: android/js8core-lib/build/outputs/aar/*.aar

    - name: Upload AAB (Release only)
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: js8call-release-aab
        path: android/app/build/outputs/bundle/release/*.aab

