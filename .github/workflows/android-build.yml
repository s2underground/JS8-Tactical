name: Android Build

on:
  push:
    branches: [ master, develop ]
    # A version tag (v1.2.0-alpha.1) builds a signed release APK and publishes it as a GitHub release.
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - 'core/**'
      - 'adapters/android/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'
  # Every pull request builds and tests, whatever it touches, so the build and the native tests
  # can be required status checks on master (a path filter would leave docs-only PRs waiting forever).
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
          - both

# Read-only by default. Only the two publish jobs at the end get write access, and they run no
# build code: they upload files the build job already made.
permissions:
  contents: read

env:
  HAMLIB_VERSION: 1b2461aba99f0dde0531e1732c00e60aeee40657
  ANDROID_NDK_VERSION: 28.2.13676358
  # Any Kotlin compiler warning fails the build (android/build.gradle.kts).
  ORG_GRADLE_PROJECT_js8KotlinWarningsAsErrors: 'true'

jobs:
  # The same native tests built with AddressSanitizer + UndefinedBehaviorSanitizer (and LeakSanitizer):
  # out-of-bounds reads/writes, use-after-free, leaks and undefined behaviour fail the job. The frame
  # decoders take bytes straight off the air, so this matters most there.
  core-sanitizers:
    name: Core native tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev

      - name: Run js8core tests under sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g1
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./scripts/test-core.sh "$RUNNER_TEMP/core-asan"

  core-tests:
    name: Core native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev

      - name: Run js8core tests
        run: ./scripts/test-core.sh

      - name: Install pinned Rust toolchain
        run: ./scripts/install-rust.sh

      # The VOACAP engine's C entry point (issue #57): refuses data paths and bad input, never
      # panics across the boundary, predicts a day. No registry is read (--offline --locked).
      - name: Run VOACAP engine tests
        working-directory: android/voacap/rust
        run: cargo test --locked --offline

  build:
    name: Build Android
    runs-on: ubuntu-latest
    outputs:
      # Set only when this run made a file to publish (see the publish jobs below).
      test_apk: ${{ steps.test_file.outputs.name }}
      release_apk: ${{ steps.release_files.outputs.name }}

    strategy:
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'both' && '["debug","release"]' || format('["{0}"]', github.event.inputs.build_type)) || (startsWith(github.ref, 'refs/tags/v') && '["release"]' || '["debug"]')) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    # The committed gradle-wrapper.jar must be an official Gradle release (checked against
    # Gradle's published checksums), since every build runs it.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Set up JDK 17
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK packages
      run: |
        SDKMANAGER=""
        for candidate in "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager; do
          if [ -x "${candidate}" ]; then
            SDKMANAGER="${candidate}"
            break
          fi
        done
        test -n "${SDKMANAGER}"
        echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
        yes | "${SDKMANAGER}" --licenses > /dev/null
        "${SDKMANAGER}" --install \
          "platform-tools" \
          "platforms;android-34" "platforms;android-36" \
          "build-tools;34.0.0" "build-tools;35.0.0" \
          "ndk;${ANDROID_NDK_VERSION}" \
          "cmake;3.22.1"

    - name: Select NDK
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

    # The VOACAP engine (android/voacap) is Rust, built by CMake through cargo.
    - name: Install pinned Rust toolchain
      run: ./scripts/install-rust.sh

    - name: Install Hamlib build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config

    - name: Cache Hamlib build
      id: cache-hamlib
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          android/hamlib/hamlib-src
          android/libs/hamlib
        key: ${{ runner.os }}-hamlib-${{ env.HAMLIB_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('android/hamlib/patches/*.patch', 'android/hamlib/build-hamlib-android.sh') }}

    - name: Build Hamlib
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        export HAMLIB_VERSION=${HAMLIB_VERSION}
        ./android/hamlib/build-hamlib-android.sh

    - name: Cache Gradle dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # Release builds must have the key. Test builds use it too when it's available (so they install
    # over releases); without it they fall back to the debug key. Pull requests never get it, not
    # even from branches in this repository: their builds aren't published, and the build runs the
    # pull request's own code and Gradle plugins.
    - name: Prepare release keystore
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_BASE64: ${{ secrets.JS8_KEYSTORE_BASE64 }}
        BUILD_TYPE: ${{ matrix.build-type }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Missing JS8_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "No release key available: this test build is signed with the debug key."
          exit 0
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks

    # The signing secrets exist only in this step's environment (they used to go to $GITHUB_ENV,
    # which handed them to every later step: tests, coverage, lint), and the keystore is deleted as
    # soon as the step ends. Secrets reach the script as environment variables, never pasted into
    # the script text.
    - name: Build with Gradle
      working-directory: android
      env:
        BUILD_TYPE: ${{ matrix.build-type }}
        JS8_KEYSTORE_FILE: release.jks
        JS8_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.JS8_KEYSTORE_PASSWORD || '' }}
        JS8_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.JS8_KEY_ALIAS || '' }}
        JS8_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.JS8_KEY_PASSWORD || '' }}
      run: |
        if [ "$BUILD_TYPE" == "release" ]; then
          ./gradlew assembleRelease bundleRelease
        else
          ./gradlew assembleDebug
        fi
        # Stop the Gradle daemon too: it would otherwise keep the passwords in its environment
        # for the steps that follow.
        ./gradlew --stop

    - name: Remove release keystore after the build
      if: always()
      run: rm -f android/release.jks

    - name: Run tests
      working-directory: android
      run: ./gradlew test

    # Unit-test line coverage (JaCoCo): totals in the run summary, full report as an artifact.
    - name: Coverage report
      if: matrix.build-type == 'debug'
      working-directory: android
      run: |
        ./gradlew :app:createDebugUnitTestCoverageReport
        python3 ../scripts/coverage-summary.py app/build/reports/coverage/test/debug/report.xml | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: matrix.build-type == 'debug'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: android/app/build/reports/coverage/test/debug/
        if-no-files-found: ignore

    # Static analysis of the Kotlin/Android code (includes Android's security checks). Known
    # findings live in android/app/lint-baseline.xml; anything new fails this job, but only after
    # the test build below has been published, so a lint finding never holds up testing.
    - name: Android lint
      id: lint
      if: matrix.build-type == 'debug'
      working-directory: android
      continue-on-error: true
      run: ./gradlew :app:lintDebug

    - name: Upload lint report
      if: always() && matrix.build-type == 'debug'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lint-report
        path: android/app/build/reports/lint-results-debug.*
        if-no-files-found: ignore

    - name: Upload APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: js8-baseline-${{ matrix.build-type }}-apk
        path: android/app/build/outputs/apk/${{ matrix.build-type }}/*.apk

    # The files to publish are prepared here (this job has the Android tools) and uploaded as
    # artifacts; the publish jobs below put them on the GitHub release.
    - name: Prepare rolling test build
      id: test_file
      if: matrix.build-type == 'debug' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        # Named JS8-Tactical-<version>-test.<build>.apk, e.g. JS8-Tactical-1.2.0-alpha.3-test.198.apk;
        # <build> is the versionCode (100 + run number) shown in Settings → About.
        VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
        NAME="JS8-Tactical-${VERSION}-test.$((100 + GITHUB_RUN_NUMBER)).apk"
        APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
        mkdir -p publish
        cp "$APK" "publish/$NAME"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    # SBOM (CycloneDX): the libraries Gradle resolved for this APK, the native code built from
    # source at its commit, and the APK's SHA-256. Published next to the APK and attested with it.
    # Runs on every debug build (pull requests too), so a broken SBOM shows up before it reaches master.
    - name: SBOM for the test build
      if: matrix.build-type == 'debug'
      env:
        NAME: ${{ steps.test_file.outputs.name }}
      run: |
        (cd android && ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath) > deps.txt
        VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
        if [ -n "$NAME" ]; then APK="publish/$NAME"; OUT="publish/${NAME%.apk}.cdx.json"
        else APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1); OUT=sbom-check.cdx.json; fi
        python3 scripts/sbom.py --apk "$APK" --version "$VERSION-test.$((100 + GITHUB_RUN_NUMBER))" \
          --gradle-deps deps.txt --out "$OUT"

    - name: Upload rolling test build
      if: steps.test_file.outputs.name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: publish-test-build
        path: publish/
        if-no-files-found: error

    - name: Prepare signed alpha/release files
      id: release_files
      if: matrix.build-type == 'release' && startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        # The tag must match the app's versionName, so the file name, the release and Settings → About agree.
        APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
        test "$VERSION" = "$APP_VERSION" || { echo "Tag $TAG does not match versionName $APP_VERSION in app/build.gradle.kts"; exit 1; }
        NAME="JS8-Tactical-${VERSION}.apk"
        APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
        test -n "$APK" || { echo "No signed release APK (is release signing configured?)"; exit 1; }
        mkdir -p publish
        cp "$APK" "publish/$NAME"
        # Checksum file: the APK's SHA-256 and the signer certificate, so users can verify the download.
        APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
        (
          cd publish
          echo "$(sha256sum "$NAME")"
          "$APKSIGNER" verify --print-certs "$NAME" | grep -E 'certificate (DN|SHA-256 digest)'
        ) > "publish/${NAME}.sha256"
        cat "publish/${NAME}.sha256"
        (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) > deps.txt
        python3 scripts/sbom.py --apk "publish/$NAME" --version "$VERSION" --gradle-deps deps.txt \
          --out "publish/${NAME%.apk}.cdx.json"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload signed alpha/release files
      if: steps.release_files.outputs.name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: publish-release
        path: publish/
        if-no-files-found: error

    - name: Upload AAR
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: js8call-core-aar
        path: android/js8core-lib/build/outputs/aar/*.aar

    - name: Upload AAB (Release only)
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: js8call-release-aab
        path: android/app/build/outputs/bundle/release/*.aab

    - name: Fail if lint failed
      if: steps.lint.outcome == 'failure'
      run: |
        echo "The Android lint step failed: either it found new issues (see the lint-report artifact and fix"
        echo "them), or lint itself could not run (see the step's log, e.g. a dependency download error)."
        # The findings, in the log too, so they can be read without downloading the artifact.
        REPORT=$(find android/app/build -name 'lint-results-debug.txt' 2>/dev/null | head -1)
        if [ -n "$REPORT" ]; then
          echo "::group::Lint findings (one line each)"
          grep -E ': (Error|Warning): ' "$REPORT" || true
          echo "::endgroup::"
        fi
        exit 1

    - name: Remove release keystore
      if: always()
      run: rm -f android/release.jks

  # Puts the rolling test build on the "test-build" release. Write access, but no build code runs
  # here. Runs even when lint failed later in the build job, so a lint finding never holds up testing.
  publish-test-build:
    name: Publish rolling test build
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.test_apk != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (SLSA) for the APK and its SBOM, signed with GitHub's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - name: Download test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-test-build
          path: publish

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            publish/*.apk
            publish/*.cdx.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.build.outputs.test_apk }}
        run: |
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Latest test build" --notes "Rolling test build from master."
          # Only the newest test build is kept on the release.
          for old in $(gh release view test-build --json assets --jq '.assets[].name' | grep -E '\.(apk|cdx\.json)$'); do
            gh release delete-asset test-build "$old" -y
          done
          gh release upload test-build "publish/$NAME" "publish/${NAME%.apk}.cdx.json" --clobber
          gh release edit test-build --notes "Rolling test build from master. Commit ${GITHUB_SHA::8}, run #${GITHUB_RUN_NUMBER}, built $(date -u +%Y-%m-%dT%H:%MZ)."

  # Puts the signed APK and its .sha256 on the release for the tag.
  publish-release:
    name: Publish signed alpha/release build
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.release_apk != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-release
          path: publish

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            publish/*.apk
            publish/*.cdx.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.build.outputs.release_apk }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""; case "$TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease";; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --title "JS8-Tactical ${TAG}" --notes "Signed build of ${TAG} (commit ${GITHUB_SHA::8})."
          gh release upload "$TAG" "publish/$NAME" "publish/${NAME}.sha256" "publish/${NAME%.apk}.cdx.json" --clobber

