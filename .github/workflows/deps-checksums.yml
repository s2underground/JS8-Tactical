name: Dependency checksums

# Gradle dependency verification (android/gradle/verification-metadata.xml): every library and
# plugin the build downloads must match a recorded SHA-256, so a tampered artifact fails the
# build. When a pull request changes dependencies (Dependabot or anyone in this repository), this
# workflow records the checksums of the new versions:
#   1. "Record checksums" runs the same Gradle tasks as CI with a read-only token and writes the
#      new entries (it runs build code, so it gets no write access);
#   2. "Commit checksums" runs no build code: it takes only the generated XML file, checks it, commits
#      it to the pull request branch and re-runs the required checks there.
# The new entries show up in the pull request diff for review like any other change.
on:
  pull_request:
    paths:
      - 'android/**/*.gradle.kts'
      - 'android/gradle/libs.versions.toml'
      - 'android/gradle/wrapper/**'
      - 'android/gradle.properties'
      - '.github/workflows/deps-checksums.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HAMLIB_VERSION: 1b2461aba99f0dde0531e1732c00e60aeee40657
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  record:
    name: Record checksums
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          for candidate in "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "${candidate}" ]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done
          test -n "${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Select NDK
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # The VOACAP engine (android/voacap) is Rust, built by CMake through cargo.
      - name: Install pinned Rust toolchain
        run: ./scripts/install-rust.sh

      - name: Install Hamlib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Cache Hamlib build
        id: cache-hamlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/hamlib/hamlib-src
            android/libs/hamlib
          key: ${{ runner.os }}-hamlib-${{ env.HAMLIB_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('android/hamlib/patches/*.patch', 'android/hamlib/build-hamlib-android.sh') }}

      - name: Build Hamlib
        if: steps.cache-hamlib.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export HAMLIB_VERSION=${HAMLIB_VERSION}
          ./android/hamlib/build-hamlib-android.sh

      # Every task the CI workflows run, so every artifact they download is recorded.
      - name: Write verification metadata
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug assembleRelease bundleRelease test :app:lintDebug \
            :app:createDebugUnitTestCoverageReport compileDebugKotlin compileDebugJavaWithJavac \
            :app:dependencies
          # Lint of the library modules, as the dependency-cache workflow runs it (their findings
          # don't matter here, only what lint downloads).
          ./gradlew --no-daemon --continue --write-verification-metadata sha256 lintDebug > /dev/null 2>&1 || true
          ls -l gradle/verification-metadata.xml
          grep -c '<component ' gradle/verification-metadata.xml

      - name: Upload the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error

  commit:
    name: Commit checksums
    needs: record
    # Branches in this repository only (a fork's branch can't be pushed to with this token).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: generated

      # Only a well-formed verification file, nothing else, goes into the commit.
      - name: Check the file
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("generated/verification-metadata.xml").getroot()
          assert root.tag.endswith("verification-metadata"), root.tag
          n = sum(1 for e in root.iter() if e.tag.endswith("component"))
          assert n > 50, f"only {n} components"
          print(f"{n} components")
          PY
          cp generated/verification-metadata.xml android/gradle/verification-metadata.xml

      - name: Commit and re-run the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- android/gradle/verification-metadata.xml && git ls-files --error-unmatch android/gradle/verification-metadata.xml >/dev/null 2>&1; then
            echo "Checksums already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml
          git commit -m "Record dependency checksums" -m "Generated by the Dependency checksums workflow (run ${GITHUB_RUN_ID})."
          git push origin "HEAD:$BRANCH"
          # A push made with this token starts no workflows, so start the required ones on the new commit.
          gh workflow run android-build.yml --ref "$BRANCH"
          gh workflow run codeql.yml --ref "$BRANCH"
