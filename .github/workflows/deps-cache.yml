# Publishes the Gradle dependency cache and prebuilt Hamlib libraries as a
# release asset ("build-cache"), so a development machine without access to
# Maven Central / the Gradle portal can build offline with `--offline`.
name: Dependency cache

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'android/**/*.gradle.kts'
      - 'android/gradle/**'
      - 'android/gradle.properties'
      - '.github/workflows/deps-cache.yml'

permissions:
  contents: read

env:
  HAMLIB_VERSION: 1b2461aba99f0dde0531e1732c00e60aeee40657
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  cache:
    name: Build and publish dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Publishes the cache as a release asset at the end.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          for candidate in "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "${candidate}" ]; then SDKMANAGER="${candidate}"; break; fi
          done
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Hamlib
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          ./android/hamlib/build-hamlib-android.sh

      - name: Build and test (fills the Gradle cache)
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --continue assembleDebug test 2>&1 | tee ../build-log.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          # Make sure lint dependencies are cached too (not fatal).
          ./gradlew --no-daemon lintDebug > /dev/null 2>&1 || true

      - name: Package cache
        if: always()
        run: |
          tar -C "$HOME/.gradle" -cf - caches/modules-2 wrapper/dists | zstd -T0 -10 -o gradle-cache.tar.zst
          tar -C android -cf - libs/hamlib | zstd -T0 -10 -o hamlib-libs.tar.zst
          ls -la *.tar.zst

      - name: Publish release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-cache >/dev/null 2>&1 || gh release create build-cache --prerelease --title "Build cache (dev only)" --notes "Gradle dependency cache and prebuilt Hamlib for offline development builds. Not an app release."
          gh release upload build-cache gradle-cache.tar.zst hamlib-libs.tar.zst build-log.txt --clobber
          gh release edit build-cache --notes "Gradle dependency cache and prebuilt Hamlib for offline development builds. Not an app release. Commit ${GITHUB_SHA::8}, built $(date -u +%Y-%m-%dT%H:%MZ)."

      - name: Fail if the build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
