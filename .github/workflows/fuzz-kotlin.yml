name: Fuzz Kotlin parsers

# Jazzer (coverage-guided fuzzing for the JVM) on the app's Kotlin code that reads text received
# over the air: store-and-forward commands and the access rule for handing out held messages,
# report lines with their locations and times, message rollup, the diagnostics privacy
# scrub, directed/relay frames with their checksums and reply paths, automatic replies, and
# the frame-by-frame assembly of relays and stored messages. A
# finding fails the run; its input and a Java reproducer are kept as an artifact.
on:
  schedule:
    - cron: '41 5 * * 0'   # weekly, Sunday 05:41 UTC
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/fuzz/kotlin/**'
      - 'scripts/fuzz-kotlin.sh'
      - 'android/app/src/main/java/com/js8call/example/storeforward/Held.kt'
      - 'android/app/src/main/java/com/js8call/example/reports/Reports.kt'
      - 'android/app/src/main/java/com/js8call/example/reports/Geo.kt'
      - 'android/app/src/main/java/com/js8call/example/rollup/RollupEngine.kt'
      - 'android/app/src/main/java/com/js8call/example/DiagnosticsPrivacy.kt'
      - 'android/app/src/main/java/com/js8call/example/service/RelayProtocol.kt'
      - 'android/app/src/main/java/com/js8call/example/service/AutoReply.kt'
      - 'android/app/src/main/java/com/js8call/example/service/RelayAssembler.kt'
      - 'android/app/src/main/java/com/js8call/example/service/MsgAssembler.kt'
      - 'android/app/src/main/java/com/js8call/example/util/Js8Commands.kt'
      - 'android/app/src/main/java/com/js8call/example/util/CallsignValidator.kt'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  jazzer:
    name: Jazzer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Kotlin compiler and Jazzer, kept between runs: GitHub rate-limits release downloads
      # (HTTP 429). The script still checks every file's SHA-256 before using it.
      - name: Cache fuzzing tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/fuzz-kotlin/tools/*.jar
            build/fuzz-kotlin/tools/kotlinc.zip
          key: fuzz-kotlin-tools-${{ hashFiles('scripts/fuzz-kotlin.sh') }}

      # Pull requests get a short run; the weekly run goes longer.
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '60') || '300' }}
        run: scripts/fuzz-kotlin.sh "$SECONDS_PER_TARGET"

      - name: Keep findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-fuzz-findings
          path: |
            build/fuzz-kotlin/crash-*
            build/fuzz-kotlin/Crash_*.java
          if-no-files-found: ignore
